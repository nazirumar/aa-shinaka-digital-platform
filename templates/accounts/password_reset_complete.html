{% extends "base.html" %}

{% block title %}Password updated{% endblock %}

{% block content %}
<div class="mx-auto max-w-md px-4 py-16 text-center">
  <h1 class="text-2xl font-semibold text-stone-900">Your password has been updated</h1>
  <p class="mt-3 text-sm text-stone-600">You can now sign in with your new password.</p>
  <a href="{% url 'accounts:login' %}" class="mt-6 inline-block rounded-md bg-brand-600 px-4 py-2 text-sm font-medium text-white hover:bg-brand-700">Sign in</a>
</div>
{% endblock %}
