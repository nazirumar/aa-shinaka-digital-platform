{% extends "base.html" %}

{% block title %}Check your email{% endblock %}

{% block content %}
<div class="mx-auto max-w-md px-4 py-16 text-center">
  <h1 class="text-2xl font-semibold text-stone-900">Check your email</h1>
  <p class="mt-3 text-sm text-stone-600">
    If an account exists for that address, we've sent a secure link to reset your password.
    The link expires for your security.
  </p>
  <a href="{% url 'accounts:login' %}" class="mt-6 inline-block rounded-md bg-brand-600 px-4 py-2 text-sm font-medium text-white hover:bg-brand-700">Back to sign in</a>
</div>
{% endblock %}
