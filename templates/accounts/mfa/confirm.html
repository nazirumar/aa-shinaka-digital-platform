{% extends "accounts/account_base.html" %}

{% block account_content %}
<div class="rounded-xl border border-stone-200 bg-white p-6">
  <h2 class="text-lg font-semibold text-stone-900">Confirm MFA</h2>
  <p class="mt-1 text-sm text-stone-600">Enter the code from your authenticator to confirm.</p>
  <form method="post" class="mt-4">
    {% csrf_token %}
    {% for field in form %}
      {% include "components/form_field.html" with field=field %}
    {% endfor %}
    <button type="submit" class="mt-3 rounded-md bg-brand-600 px-4 py-2.5 font-medium text-white hover:bg-brand-700">Confirm</button>
  </form>
</div>
{% endblock %}
