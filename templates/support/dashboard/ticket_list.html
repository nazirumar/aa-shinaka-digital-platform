{% extends "dashboard/base.html" %}

{% block dashboard_content %}
<div class="space-y-4">
  <form method="get" class="grid gap-3 rounded-xl border border-stone-200 bg-white p-4 sm:grid-cols-2 lg:grid-cols-5"
        hx-get="{% url 'support_dashboard:ticket_list' %}" hx-target="#support-ticket-table" hx-swap="outerHTML" hx-push-url="true">
    <div>
      <label class="block text-xs font-medium text-stone-500" for="f-q">Search</label>
      <input id="f-q" type="search" name="q" value="{{ filters.query }}" class="mt-1 w-full rounded-md border border-stone-300 px-3 py-2 text-sm" placeholder="Reference, subject, email">
    </div>
    <div>
      <label class="block text-xs font-medium text-stone-500" for="f-status">Status</label>
      <select id="f-status" name="status" class="mt-1 w-full rounded-md border border-stone-300 px-3 py-2 text-sm">
        <option value="">Any</option>
        {% for value, label in statuses %}<option value="{{ value }}" {% if value == filters.status %}selected{% endif %}>{{ label }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-xs font-medium text-stone-500" for="f-priority">Priority</label>
      <select id="f-priority" name="priority" class="mt-1 w-full rounded-md border border-stone-300 px-3 py-2 text-sm">
        <option value="">Any</option>
        {% for value, label in priorities %}<option value="{{ value }}" {% if value == filters.priority %}selected{% endif %}>{{ label }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-xs font-medium text-stone-500" for="f-category">Category</label>
      <select id="f-category" name="category" class="mt-1 w-full rounded-md border border-stone-300 px-3 py-2 text-sm">
        <option value="">Any</option>
        {% for value, label in categories %}<option value="{{ value }}" {% if value == filters.category %}selected{% endif %}>{{ label }}</option>{% endfor %}
      </select>
    </div>
    <div class="flex items-end gap-2">
      <div class="flex-1">
        <label class="block text-xs font-medium text-stone-500" for="f-assignee">Assignee</label>
        <select id="f-assignee" name="assignee" class="mt-1 w-full rounded-md border border-stone-300 px-3 py-2 text-sm">
          <option value="">Anyone</option>
          <option value="unassigned" {% if filters.assignee == 'unassigned' %}selected{% endif %}>Unassigned</option>
        </select>
      </div>
      <button type="submit" class="rounded-md bg-brand-600 px-4 py-2 text-sm font-medium text-white hover:bg-brand-700">Apply</button>
    </div>
  </form>

  <div class="rounded-xl border border-stone-200 bg-white">
    {% include "support/dashboard/_ticket_table.html" with tickets=tickets %}
  </div>
</div>
{% endblock %}
