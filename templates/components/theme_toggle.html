{% load i18n %}{% comment %}
Theme switcher (Light / Dark / System) for the public navbar and the dashboard
header. Backed by the Alpine ``theme`` store registered in
``components/theme_init.html``; the choice is persisted in localStorage and
``System`` follows the OS setting.
{% endcomment %}
<div class="relative" x-data="{ open: false }" @keydown.escape.window="open = false">
  <button type="button"
          class="inline-flex items-center justify-center rounded-full p-2 text-stone-600 transition-colors hover:bg-brand-50 hover:text-forest focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-leaf/40 dark:text-stone-300 dark:hover:bg-stone-800 dark:hover:text-white"
          @click="open = !open" :aria-expanded="open" aria-haspopup="true"
          aria-label="{% trans 'Theme' %}" title="{% trans 'Theme' %}">
    <svg x-show="$store.theme.isDark" x-cloak class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/></svg>
    <svg x-show="!$store.theme.isDark" x-cloak class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"/></svg>
  </button>
  <div x-show="open" x-cloak @click.outside="open = false"
       x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0 -translate-y-1" x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition ease-in duration-100" x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0"
       class="absolute right-0 z-50 mt-2 w-40 overflow-hidden rounded-xl border border-stone-200 bg-white p-1.5 text-sm shadow-xl dark:border-stone-700 dark:bg-stone-900"
       role="menu">
    <button type="button" role="menuitemradio" :aria-checked="$store.theme.preference === 'light'"
            class="flex w-full items-center justify-between gap-2 rounded-lg px-3 py-2 text-left text-stone-700 transition-colors hover:bg-brand-50 hover:text-forest dark:text-stone-200 dark:hover:bg-stone-800 dark:hover:text-white"
            @click="$store.theme.set('light'); open = false">
      <span class="flex items-center gap-2">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/></svg>
        {% trans "Light" %}
      </span>
      <svg x-show="$store.theme.preference === 'light'" x-cloak class="h-4 w-4 text-forest dark:text-brand-300" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
    </button>
    <button type="button" role="menuitemradio" :aria-checked="$store.theme.preference === 'dark'"
            class="flex w-full items-center justify-between gap-2 rounded-lg px-3 py-2 text-left text-stone-700 transition-colors hover:bg-brand-50 hover:text-forest dark:text-stone-200 dark:hover:bg-stone-800 dark:hover:text-white"
            @click="$store.theme.set('dark'); open = false">
      <span class="flex items-center gap-2">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"/></svg>
        {% trans "Dark" %}
      </span>
      <svg x-show="$store.theme.preference === 'dark'" x-cloak class="h-4 w-4 text-forest dark:text-brand-300" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
    </button>
    <button type="button" role="menuitemradio" :aria-checked="$store.theme.preference === 'system'"
            class="flex w-full items-center justify-between gap-2 rounded-lg px-3 py-2 text-left text-stone-700 transition-colors hover:bg-brand-50 hover:text-forest dark:text-stone-200 dark:hover:bg-stone-800 dark:hover:text-white"
            @click="$store.theme.set('system'); open = false">
      <span class="flex items-center gap-2">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 0 1-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0 1 15 18.257V17.25m6-12V15a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 15V5.25m18 0A2.25 2.25 0 0 0 18.75 3H5.25A2.25 2.25 0 0 0 3 5.25m18 0V12a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 12V5.25"/></svg>
        {% trans "System" %}
      </span>
      <svg x-show="$store.theme.preference === 'system'" x-cloak class="h-4 w-4 text-forest dark:text-brand-300" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
    </button>
  </div>
</div>
