{% comment %}Inline alert. Props: type (info|success|warning|error), message, title.{% endcomment %}
<div role="alert" class="flex gap-3 rounded-lg border px-4 py-3 text-sm
  {% if type == 'success' %}border-brand-300 bg-brand-50 text-brand-800 dark:border-brand-800 dark:bg-brand-950 dark:text-brand-200
  {% elif type == 'warning' %}border-amber-300 bg-amber-50 text-amber-800 dark:border-amber-800 dark:bg-amber-950 dark:text-amber-200
  {% elif type == 'error' %}border-red-300 bg-red-50 text-red-800 dark:border-red-800 dark:bg-red-950 dark:text-red-200
  {% else %}border-stone-300 bg-stone-50 text-stone-700 dark:border-stone-700 dark:bg-stone-900 dark:text-stone-200{% endif %}">
  <div>
    {% if title %}<p class="font-medium">{{ title }}</p>{% endif %}
    <p>{{ message }}</p>
  </div>
</div>
