{% comment %}Empty-state block. Props: title, message, action_url, action_label.{% endcomment %}
<div class="rounded-lg border border-dashed border-stone-300 bg-stone-50 p-8 text-center">
  <h3 class="text-sm font-semibold text-stone-800">{{ title }}</h3>
  {% if message %}<p class="mt-1 text-sm text-stone-600">{{ message }}</p>{% endif %}
  {% if action_url and action_label %}
    <a href="{{ action_url }}" class="mt-4 inline-block rounded-md bg-brand-600 px-4 py-2 text-sm font-medium text-white hover:bg-brand-700">{{ action_label }}</a>
  {% endif %}
</div>
