<!doctype html>
<html lang="en">
<body style="margin:0;background:#F7F5EE;font-family:Arial,Helvetica,sans-serif;color:#1c1917;">
  <div style="max-width:560px;margin:0 auto;padding:24px;">
    <div style="background:#174C38;color:#ffffff;padding:16px 20px;border-radius:10px 10px 0 0;">
      <strong style="font-size:16px;">{{ company.site_name|default:"AA Shinaka" }}</strong>
    </div>
    <div style="background:#ffffff;padding:20px;border:1px solid #e7e5e4;border-top:none;border-radius:0 0 10px 10px;">
      <h1 style="margin:0 0 8px;font-size:18px;color:#174C38;">{{ heading }}</h1>
      {% if intro %}<p style="margin:0 0 16px;font-size:14px;line-height:1.6;color:#44403c;">{{ intro }}</p>{% endif %}
      {% if notification.url and site_url %}
        <p style="margin:0 0 16px;">
          <a href="{{ site_url }}{{ notification.url }}" style="display:inline-block;background:#2F855A;color:#ffffff;text-decoration:none;padding:10px 16px;border-radius:6px;font-size:14px;">View details</a>
        </p>
      {% endif %}
      <p style="margin:16px 0 0;font-size:12px;color:#78716c;">This is an automated message about your AA Shinaka account.</p>
    </div>
  </div>
</body>
</html>
