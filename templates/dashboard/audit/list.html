{% extends "dashboard/base.html" %}

{% block title %}Audit log{% endblock %}

{% block dashboard_content %}
<div>
  <h1 class="text-lg font-semibold text-stone-900">Audit log</h1>
  <p class="text-sm text-stone-600">Append-only record of security-sensitive actions. Entries cannot be edited here.</p>
</div>

<form class="mt-4 flex flex-wrap items-end gap-3 rounded-xl border border-stone-200 bg-white p-4"
      hx-get="{% url 'dashboard:audit_log' %}"
      hx-target="#audit-table"
      hx-trigger="change, keyup changed delay:300ms from:input[name='q']"
      hx-push-url="true"
      role="search">
  <div class="min-w-[12rem] flex-1">
    <label for="audit-q" class="block text-xs font-medium text-stone-600">Search</label>
    <input id="audit-q" type="search" name="q" value="{{ query }}" placeholder="Action, target or actor"
           class="mt-1 w-full rounded-md border border-stone-300 px-3 py-2 text-sm">
  </div>
  <div>
    <label for="audit-action" class="block text-xs font-medium text-stone-600">Action</label>
    <input id="audit-action" type="text" name="action" value="{{ selected_action }}" placeholder="e.g. staff.created"
           class="mt-1 rounded-md border border-stone-300 px-3 py-2 text-sm">
  </div>
  <button type="submit" class="rounded-md border border-stone-300 px-4 py-2 text-sm hover:bg-stone-100">Filter</button>
</form>

<div id="audit-table" class="mt-4 overflow-hidden rounded-xl border border-stone-200 bg-white">
  {% include "dashboard/audit/_table.html" %}
</div>
{% endblock %}
