{% extends "dashboard/base.html" %}

{% block title %}Staff{% endblock %}

{% block dashboard_content %}
<div class="flex flex-wrap items-center justify-between gap-3">
  <div>
    <h1 class="text-lg font-semibold text-stone-900">Staff directory</h1>
    <p class="text-sm text-stone-600">Search, filter and manage staff accounts.</p>
  </div>
  {% if can_manage %}
    <a href="{% url 'dashboard:staff_create' %}" class="rounded-md bg-brand-600 px-4 py-2 text-sm font-medium text-white hover:bg-brand-700">Create staff</a>
  {% endif %}
</div>

<form id="staff-filters"
      class="mt-4 flex flex-wrap items-end gap-3 rounded-xl border border-stone-200 bg-white p-4"
      hx-get="{% url 'dashboard:staff_list' %}"
      hx-target="#staff-table"
      hx-trigger="change, keyup changed delay:300ms from:input[name='q']"
      hx-push-url="true"
      role="search">
  <div class="min-w-[12rem] flex-1">
    <label for="staff-q" class="block text-xs font-medium text-stone-600">Search</label>
    <input id="staff-q" type="search" name="q" value="{{ query }}" placeholder="Name, email or phone"
           class="mt-1 w-full rounded-md border border-stone-300 px-3 py-2 text-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-200">
  </div>
  <div>
    <label for="staff-role" class="block text-xs font-medium text-stone-600">Role</label>
    <select id="staff-role" name="role" class="mt-1 rounded-md border border-stone-300 px-3 py-2 text-sm">
      <option value="">All roles</option>
      {% for value, label in role_choices %}
        <option value="{{ value }}" {% if selected_role == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label for="staff-status" class="block text-xs font-medium text-stone-600">Status</label>
    <select id="staff-status" name="status" class="mt-1 rounded-md border border-stone-300 px-3 py-2 text-sm">
      <option value="">All</option>
      <option value="active" {% if selected_status == 'active' %}selected{% endif %}>Active</option>
      <option value="inactive" {% if selected_status == 'inactive' %}selected{% endif %}>Inactive</option>
    </select>
  </div>
  <button type="submit" class="rounded-md border border-stone-300 px-4 py-2 text-sm hover:bg-stone-100">Filter</button>
</form>

<div id="staff-table" class="mt-4 overflow-hidden rounded-xl border border-stone-200 bg-white">
  {% include "dashboard/staff/_table.html" %}
</div>
{% endblock %}
