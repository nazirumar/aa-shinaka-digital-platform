{% extends "dashboard/base.html" %}
{% block dashboard_content %}
<div class="overflow-hidden rounded-xl border border-stone-200 bg-white">
  <table class="w-full text-sm">
    <thead class="border-b border-stone-200 bg-stone-50 text-left text-stone-500">
      <tr><th class="px-4 py-2">Reference</th><th class="px-4 py-2">Project</th><th class="px-4 py-2">Status</th><th class="px-4 py-2">Manager</th></tr>
    </thead>
    <tbody class="divide-y divide-stone-100">
      {% for p in projects %}
        <tr>
          <td class="px-4 py-2"><a href="{% url 'services_dashboard:farm_project_detail' p.pk %}" class="font-medium text-forest hover:underline">{{ p.reference }}</a></td>
          <td class="px-4 py-2">{{ p.name }}</td>
          <td class="px-4 py-2">{{ p.get_status_display }}</td>
          <td class="px-4 py-2">{{ p.manager.email|default:"—" }}</td>
        </tr>
      {% empty %}
        <tr><td colspan="4" class="px-4 py-6 text-center text-stone-500">No projects found.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
