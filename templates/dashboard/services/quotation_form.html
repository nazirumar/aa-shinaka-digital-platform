{% extends "dashboard/base.html" %}
{% block dashboard_content %}
<form method="post" class="max-w-3xl space-y-4 rounded-xl border border-stone-200 bg-white p-5">
  {% csrf_token %}
  <p class="text-sm text-stone-600">Customer: <span class="font-medium">{{ service_request.customer.email }}</span> · Request {{ service_request.reference }}</p>
  <div class="space-y-2">
    <div class="grid grid-cols-12 gap-2 text-xs font-medium uppercase tracking-wide text-stone-500">
      <span class="col-span-6">Description</span><span class="col-span-2">Qty</span><span class="col-span-3">Unit price</span>
    </div>
    <div id="line-items" class="space-y-2">
      {% for i in "123" %}
        <div class="grid grid-cols-12 gap-2">
          <input type="text" name="item_description" class="col-span-6 rounded-md border border-stone-300 px-3 py-2 text-sm" placeholder="Service line">
          <input type="number" step="0.001" min="0" name="item_quantity" value="1" class="col-span-2 rounded-md border border-stone-300 px-3 py-2 text-sm">
          <input type="number" step="0.01" min="0" name="item_unit_price" value="0" class="col-span-3 rounded-md border border-stone-300 px-3 py-2 text-sm">
        </div>
      {% endfor %}
    </div>
    <button type="button" id="add-line" class="rounded-md border border-stone-300 px-3 py-1.5 text-sm hover:bg-stone-100">Add line</button>
  </div>
  <label class="block text-sm"><span class="block text-stone-600">Valid until</span>
    <input type="date" name="valid_until" class="mt-1 rounded-md border border-stone-300 px-3 py-2"></label>
  <label class="block text-sm"><span class="block text-stone-600">Terms</span>
    <textarea name="terms" rows="3" class="mt-1 w-full rounded-md border border-stone-300 px-3 py-2"></textarea></label>
  <button type="submit" class="rounded-md bg-forest px-4 py-2 text-sm font-medium text-white hover:bg-forest-dark">Save draft quotation</button>
</form>

<script>
  (function () {
    var add = document.getElementById('add-line');
    var list = document.getElementById('line-items');
    if (!add || !list) return;
    add.addEventListener('click', function () {
      var row = list.firstElementChild.cloneNode(true);
      row.querySelectorAll('input').forEach(function (i) { if (i.name === 'item_quantity') i.value = '1'; else if (i.name === 'item_unit_price') i.value = '0'; else i.value = ''; });
      list.appendChild(row);
    });
  })();
</script>
{% endblock %}
