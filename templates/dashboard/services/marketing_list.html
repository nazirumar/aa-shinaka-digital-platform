{% extends "dashboard/base.html" %}
{% block dashboard_content %}
<form method="get" class="mb-4 flex items-end gap-3">
  <input type="text" name="q" value="{{ query }}" placeholder="Search product or customer" class="rounded-md border border-stone-300 px-3 py-2 text-sm">
  <button type="submit" class="rounded-md border border-stone-300 px-4 py-2 text-sm hover:bg-stone-100">Search</button>
</form>
<div class="overflow-hidden rounded-xl border border-stone-200 bg-white">
  <table class="w-full text-sm">
    <thead class="border-b border-stone-200 bg-stone-50 text-left text-stone-500">
      <tr><th class="px-4 py-2">Reference</th><th class="px-4 py-2">Product</th><th class="px-4 py-2">Customer</th><th class="px-4 py-2">Status</th></tr>
    </thead>
    <tbody class="divide-y divide-stone-100">
      {% for e in enquiries %}
        <tr>
          <td class="px-4 py-2"><a href="{% url 'services_dashboard:marketing_enquiry_detail' e.pk %}" class="font-medium text-forest hover:underline">{{ e.request.reference }}</a></td>
          <td class="px-4 py-2">{{ e.product_type }}</td>
          <td class="px-4 py-2">{{ e.request.customer.email }}</td>
          <td class="px-4 py-2">{{ e.request.get_status_display }}</td>
        </tr>
      {% empty %}
        <tr><td colspan="4" class="px-4 py-6 text-center text-stone-500">No enquiries found.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
