{% comment %}Shared date/period filter bar for analytics pages.{% endcomment %}
<form method="get" class="flex flex-wrap items-end gap-3 rounded-xl border border-stone-200 bg-white p-4" role="search">
  <div>
    <label for="preset" class="block text-xs font-medium text-stone-600">Period</label>
    <select id="preset" name="preset" class="mt-1 rounded-md border border-stone-300 px-3 py-2 text-sm">
      {% for value, label in presets.items %}
        <option value="{{ value }}" {% if filters.preset == value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label for="date_from" class="block text-xs font-medium text-stone-600">From</label>
    <input id="date_from" type="date" name="date_from" value="{{ filters.date_from|date:'Y-m-d' }}"
           class="mt-1 rounded-md border border-stone-300 px-3 py-2 text-sm">
  </div>
  <div>
    <label for="date_to" class="block text-xs font-medium text-stone-600">To</label>
    <input id="date_to" type="date" name="date_to" value="{{ filters.date_to|date:'Y-m-d' }}"
           class="mt-1 rounded-md border border-stone-300 px-3 py-2 text-sm">
  </div>
  <button type="submit" class="rounded-md bg-brand-600 px-4 py-2 text-sm font-medium text-white hover:bg-brand-700">Apply</button>
  <p class="ml-auto text-xs text-stone-500">Showing: {{ filters.label }}</p>
</form>
