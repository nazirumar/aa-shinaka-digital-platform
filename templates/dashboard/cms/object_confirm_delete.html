{% extends "dashboard/base.html" %}
{% block dashboard_content %}
<div class="max-w-lg rounded-xl border border-stone-200 bg-white p-6">
  <h2 class="text-lg font-semibold text-stone-900">Delete {{ title|lower }}?</h2>
  <p class="mt-2 text-sm text-stone-600">This action cannot be undone. Any related inline content will also be removed.</p>
  <p class="mt-4 rounded-md bg-cream-100 px-4 py-3 text-sm text-stone-700">{{ object }}</p>
  <form method="post" class="mt-6 flex items-center gap-3">
    {% csrf_token %}
    <button type="submit" class="rounded-md bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700">Delete</button>
    <a href="{{ cancel_url }}" class="text-sm text-stone-600 hover:text-forest">Cancel</a>
  </form>
</div>
{% endblock %}
