{% load i18n catalog_tags %}
<a id="cart-summary" href="{% url 'orders:cart' %}" class="relative inline-flex items-center gap-1 text-sm font-medium text-stone-600 hover:text-forest">
  {% trans "Cart" %}
  {% if summary.item_count %}
    <span class="rounded-full bg-forest px-2 py-0.5 text-xs font-semibold text-white">{{ summary.item_count }}</span>
  {% endif %}
</a>
