name: CI

# Every job below is a MANDATORY check. Configure branch protection on
# `master` to require: lint, checks, assets, test, security.
# No job uses `continue-on-error`; a failing job blocks the merge.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

env:
  DJANGO_SETTINGS_MODULE: config.settings.test
  DJANGO_SECRET_KEY: ci-only-not-a-real-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
  DATABASE_URL: postgres://aa_shinaka:aa_shinaka@localhost:5432/aa_shinaka
  CACHE_URL: locmemcache://

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (version in the comment) so a
      # moved tag can never inject different code into the pipeline.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  checks:
    name: Django system & migration checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: aa_shinaka
          POSTGRES_USER: aa_shinaka
          POSTGRES_PASSWORD: aa_shinaka
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aa_shinaka"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Django check
        run: uv run python manage.py check --fail-level ERROR
      - name: Missing-migration guard
        run: uv run python manage.py makemigrations --check --dry-run

  assets:
    name: Static asset build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.18.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:css
      - name: Verify the Tailwind bundle was produced
        run: test -s static/css/app.css

  test:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: aa_shinaka
          POSTGRES_PASSWORD: aa_shinaka
          POSTGRES_DB: aa_shinaka
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Security tests (auth, MFA, hardening, E2E) — run first, fail fast
        run: >-
          uv run pytest
          tests/test_security.py
          tests/test_production_security.py
          tests/test_mfa.py
          tests/test_e2e.py
          -q
      - name: Run full suite with coverage
        run: uv run pytest --cov=apps --cov=config --cov-report=xml --cov-report=term-missing -q
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          enable-cache: true
      - run: uv sync --frozen

      # Audit the PROJECT's locked dependencies. Running `pip-audit` with no
      # target through `uvx` audits the ephemeral uvx tool environment (i.e.
      # pip-audit's own dependencies), never this project's — so the lock is
      # exported and passed explicitly with `-r`. An empty export is a hard
      # failure rather than a silent pass.
      - name: Export the locked requirements for auditing
        run: >-
          uv export --frozen --no-emit-project --format requirements-txt
          --no-hashes > requirements-audit.txt

      # Mandatory scan (no continue-on-error). `--strict` also fails when the
      # scan itself cannot complete, so BOTH outcomes block the merge — this
      # step only distinguishes them so the right fix is applied:
      #   * vulnerability finding  -> bump/replace the vulnerable dependency
      #   * tool/service failure   -> re-run / fix the scanner, never waive
      - name: Dependency vulnerability scan (pip-audit, pinned)
        run: |
          set +e
          if [ ! -s requirements-audit.txt ]; then
            echo "::error::requirements-audit.txt is empty — the lock export failed; refusing to report a clean scan."
            exit 1
          fi
          uvx --from pip-audit==2.10.1 pip-audit --strict --progress-spinner off -r requirements-audit.txt > audit.log 2>&1
          status=$?
          cat audit.log
          if [ "$status" -eq 0 ]; then
            echo "No known vulnerabilities found."
            exit 0
          fi
          # Real pip-audit output, e.g. "Found 8 known vulnerabilities in 1
          # package". The "No known vulnerabilities found." phrasing (seen when
          # --strict aborts the scan) must NOT be read as a finding.
          if grep -qiE "found [0-9]+ (known )?vulnerabilit|vulnerabilit(y|ies) (were )?found" audit.log \
             && ! grep -qi "no known vulnerabilities found" audit.log; then
            echo "::error::DEPENDENCY VULNERABILITY FINDING (not a tool failure): known-vulnerable packages are pinned in uv.lock. Update or remove the affected packages, then re-run."
            exit 1
          fi
          echo "::error::TOOL FAILURE (not a vulnerability finding): pip-audit could not complete (exit $status) — network/service/collection problem. Re-run the workflow; do not waive or merge."
          exit 1

      - name: Django deployment check (production settings)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: a-very-long-ci-only-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
          DJANGO_ALLOWED_HOSTS: example.com
          CSRF_TRUSTED_ORIGINS: https://example.com
          CACHE_URL: redis://localhost:6379/2
          DATABASE_URL: postgres://aa_shinaka:aa_shinaka@localhost:5432/aa_shinaka
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST: smtp.example.com
        run: uv run python manage.py check --deploy --fail-level ERROR
