# ---------------------------------------------------------------------------
# STAGING override for deploy/docker-compose.yml.
#
#   docker compose --env-file deploy/.env.staging \
#     -f deploy/docker-compose.yml -f deploy/docker-compose.staging.yml up -d --build
#
# What this changes:
#   * a distinct Compose project name ("aa-shinaka-staging") so every named
#     volume, container and network is namespaced away from production;
#   * nginx publishes non-standard host ports (8080/8443) so staging can share a
#     host with production without a port clash.
#
# It deliberately does NOT change any image, command, health check or limit, so
# staging runs the exact same application shape the launch will use.
#
# IMPORTANT — why there is no `env_file:` here:
#   Compose APPENDS `env_file` lists when override files are merged, so a
#   staging overlay that added `.env.staging` would still load the production
#   file too (and would fail outright if it did not exist). Staging therefore
#   selects its env file by setting APP_ENV_FILE=.env.staging in
#   deploy/.env.staging, which the base file interpolates. The two
#   environments never read each other's secrets.
#
# Before `up`, render the staging site config for the staging hostname:
#   deploy/scripts/render_nginx.sh staging.yourdomain.com
# ---------------------------------------------------------------------------
name: aa-shinaka-staging

services:
  nginx:
    ports:
      - "8080:80"
      - "8443:443"
