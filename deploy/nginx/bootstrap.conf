# AA Shinaka platform — nginx BOOTSTRAP site (HTTP only).
#
# Used for the very first certificate issuance, before any certificate exists,
# so nginx can serve the ACME challenge. `deploy/scripts/ssl_bootstrap.sh`
# renders this into deploy/nginx/conf.d/default.conf, obtains the certificate,
# then re-renders the TLS template (deploy/nginx/aa-shinaka.conf) and reloads.
#
# Never leave this in place after the certificate is issued.

upstream aa_shinaka_web {
    server web:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name EXAMPLE_DOMAIN www.EXAMPLE_DOMAIN;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz/ {
        proxy_pass http://aa_shinaka_web;
        access_log off;
    }

    location / {
        proxy_pass http://aa_shinaka_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_read_timeout 90s;
    }
}
