# AA Shinaka platform — nginx site (TLS).
#
# This file is a TEMPLATE. Do not mount it directly. Render it with the real
# domain (never an invented one) into deploy/nginx/conf.d/default.conf:
#
#   deploy/scripts/render_nginx.sh yourdomain.com
#
# Only the owner-supplied production hostname replaces EXAMPLE_DOMAIN, and only
# after the owner approves the domain. Public DNS is never changed by these
# scripts.
#
# TLS terminates here; Gunicorn runs the Django application behind it.

upstream aa_shinaka_web {
    server web:8000;
    keepalive 16;
}

# ---------------------------------------------------------------------------
# Edge rate limiting. The application also rate-limits login/registration/MFA
# in-process; this is the flood-suppression layer in front of it.
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=aa_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=aa_api:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=aa_conn:10m;

# HTTP: ACME challenges stay plain HTTP; everything else redirects to HTTPS.
server {
    listen 80;
    server_name EXAMPLE_DOMAIN www.EXAMPLE_DOMAIN;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz/ {
        proxy_pass http://aa_shinaka_web;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name EXAMPLE_DOMAIN www.EXAMPLE_DOMAIN;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Reject path traversal and oversized uploads early.
    client_max_body_size 12m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;

    limit_conn aa_conn 30;

    # Security headers (the application also sets these; belt and braces at the
    # edge). HSTS preload stays off until HTTPS is verified end-to-end.
    add_header Strict-Transport-Security "max-age=2592000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Dotfiles and VCS metadata are never served.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found on;
    }

    # Hashed, immutable static assets collected by Django.
    location /static/ {
        alias /srv/staticfiles/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------------------------------------------
    # Media: DEFAULT DENY. Only public asset prefixes are served directly.
    # Private documents (customer invoices, payment evidence, export
    # documents, support attachments, analytic exports) are streamed by
    # authorized Django views — never by the web server, and never
    # anonymously.
    # ------------------------------------------------------------------
    location /media/ {
        return 404;
    }
    location ^~ /media/catalog/            { alias /srv/media/catalog/; }
    location ^~ /media/cms/                { alias /srv/media/cms/; }
    location ^~ /media/training/categories/ { alias /srv/media/training/categories/; }
    location ^~ /media/training/courses/   { alias /srv/media/training/courses/; }
    location ^~ /media/training/instructors/ { alias /srv/media/training/instructors/; }

    # Authentication surfaces get an extra edge limit.
    location ^~ /accounts/login/ {
        limit_req zone=aa_auth burst=5 nodelay;
        proxy_pass http://aa_shinaka_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }
    location ^~ /accounts/password-reset/ {
        limit_req zone=aa_auth burst=5 nodelay;
        proxy_pass http://aa_shinaka_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    location ^~ /accounts/register/ {
        limit_req zone=aa_auth burst=5 nodelay;
        proxy_pass http://aa_shinaka_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Unauthenticated liveness probe for the load balancer / monitoring.
    location = /healthz/ {
        proxy_pass http://aa_shinaka_web;
        access_log off;
    }

    location / {
        limit_req zone=aa_api burst=20 nodelay;
        proxy_pass http://aa_shinaka_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }
}
