# nginx site configuration for the AA Shinaka platform (reference).
# TLS terminates here; Gunicorn runs the Django application behind it.
# Replace EXAMPLE_DOMAIN with the owner-approved production hostname.

upstream aa_shinaka_web {
    server web:8000;
    keepalive 16;
}

# HTTP: everything redirects to HTTPS (including the ACME challenge path, which
# certbot/your provider may need to serve in plain HTTP — keep it exempt).
server {
    listen 80;
    server_name EXAMPLE_DOMAIN www.EXAMPLE_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name EXAMPLE_DOMAIN www.EXAMPLE_DOMAIN;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Reject path traversal and oversized uploads early.
    client_max_body_size 12m;
    client_body_timeout 30s;

    # Security headers (the app also sets these; belt and braces at the edge).
    add_header Strict-Transport-Security "max-age=2592000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Hashed, immutable static assets collected by Django.
    location /static/ {
        alias /srv/staticfiles/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------------------------------------------
    # Media: DEFAULT DENY. Only public asset prefixes are served directly.
    # Private documents (invoices, reports, attachments, analytic exports)
    # are streamed by authorized Django views — never by the web server.
    # ------------------------------------------------------------------
    location /media/ {
        return 404;
    }
    location ^~ /media/catalog/            { alias /srv/media/catalog/; }
    location ^~ /media/cms/                { alias /srv/media/cms/; }
    location ^~ /media/training/categories/ { alias /srv/media/training/categories/; }
    location ^~ /media/training/courses/   { alias /srv/media/training/courses/; }
    location ^~ /media/training/instructors/ { alias /srv/media/training/instructors/; }

    # Unauthenticated liveness probe for the load balancer / monitoring.
    location = /healthz/ {
        proxy_pass http://aa_shinaka_web;
        access_log off;
    }

    location / {
        proxy_pass http://aa_shinaka_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }
}
