# AA Shinaka platform — LOCAL TEST nginx site (HTTP only, no TLS).
#
# Used by `deploy/docker-compose.local.yml` to run the whole production-shaped
# stack on a development machine, BEFORE any domain or certificate exists.
#
# It deliberately mirrors the production TLS template's handling of static and
# media files — including the default-deny `/media/` rule — so that local
# testing exercises the real access behaviour (private documents must 404 at the
# web server and be streamed only by authorised Django views).
#
# Render it into the mounted conf.d path with:
#
#   deploy/scripts/render_nginx.sh --local
#
# NEVER use this file on a public host: there is no TLS, no HSTS and it answers
# on plain HTTP.

upstream aa_shinaka_web {
    server web:8000;
    keepalive 16;
}

# Same edge flood-suppression zones as production.
limit_req_zone $binary_remote_addr zone=aa_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=aa_api:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=aa_conn:10m;

server {
    listen 80;
    server_name localhost 127.0.0.1;
    server_tokens off;

    client_max_body_size 12m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;

    limit_conn aa_conn 30;

    # No HSTS on purpose: pinning a browser to HTTPS for `localhost` is
    # irritating to undo.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Shared proxy settings — inherited by every proxying location below.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_redirect off;
    proxy_read_timeout 90s;
    proxy_connect_timeout 10s;

    # Dotfiles and VCS metadata are never served.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found on;
    }

    # Hashed static assets collected by Django into the shared volume.
    location /static/ {
        alias /srv/staticfiles/;
        access_log off;
        expires 1h;
    }

    # ------------------------------------------------------------------
    # Media: DEFAULT DENY — mirrors production exactly. Private documents
    # (invoices, payment evidence, export documents, support attachments)
    # are never served by the web server.
    # ------------------------------------------------------------------
    location /media/ {
        return 404;
    }
    location ^~ /media/catalog/             { alias /srv/media/catalog/; }
    location ^~ /media/cms/                 { alias /srv/media/cms/; }
    location ^~ /media/training/categories/ { alias /srv/media/training/categories/; }
    location ^~ /media/training/courses/    { alias /srv/media/training/courses/; }
    location ^~ /media/training/instructors/ { alias /srv/media/training/instructors/; }

    # Authentication surfaces get the extra edge limit.
    location ^~ /accounts/login/          { limit_req zone=aa_auth burst=5 nodelay; proxy_pass http://aa_shinaka_web; }
    location ^~ /accounts/password-reset/ { limit_req zone=aa_auth burst=5 nodelay; proxy_pass http://aa_shinaka_web; }
    location ^~ /accounts/register/       { limit_req zone=aa_auth burst=5 nodelay; proxy_pass http://aa_shinaka_web; }

    # Unauthenticated liveness probe.
    location = /healthz/ {
        proxy_pass http://aa_shinaka_web;
        access_log off;
    }

    location / {
        limit_req zone=aa_api burst=20 nodelay;
        proxy_pass http://aa_shinaka_web;
    }
}
