# Production-style deployment for an approved Linux VPS or compatible cloud host.
#
#   1. cp deploy/.env.production.example deploy/.env.production  (fill it in)
#   2. docker compose --env-file deploy/.env.production -f deploy/docker-compose.yml up -d --build
#
# This is a reference architecture (nginx + Gunicorn + PostgreSQL + Redis +
# Celery worker + Celery beat). Do not use the default passwords below in a real
# deployment — override every value in deploy/.env.production.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aa_shinaka}
      POSTGRES_USER: ${POSTGRES_USER:-aa_shinaka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aa_shinaka}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      # The web port is only exposed on the internal network; trust the proxy's
      # forwarded headers from there (nginx sets X-Forwarded-Proto/Host).
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz/')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "${CELERY_CONCURRENCY:-4}"]
    env_file:
      - .env.production
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      RUN_MIGRATIONS: "false"
      RUN_COLLECTSTATIC: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/media

  beat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    env_file:
      - .env.production
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      RUN_MIGRATIONS: "false"
      RUN_COLLECTSTATIC: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/aa-shinaka.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - media:/srv/media:ro
      - staticfiles:/srv/staticfiles:ro

volumes:
  pgdata:
  redisdata:
  media:
  staticfiles:
